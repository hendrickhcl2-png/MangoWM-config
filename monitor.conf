# Monitor Rules
# monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:10,scale:1,vrr:0,rr:0



# ── Monitor Rules ─────────────────────────────────────────────────────────────
# Laptop display: 2560x1600 @ 165Hz, scale 1.25 (16:10 HiDPI)
# External (MSI G273): 1920x1080 @ 144Hz, placed to the right
#
# IMPORTANT: Never use negative x/y coords — XWayland click events break.
# External monitor starts at x:2560 (right of laptop screen).

monitorrule=name:eDP-2,width:2560,height:1600,refresh:165,x:0,y:0,scale:1.25,vrr:1,rr:0
monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:144,x:2048,y:0,scale:1,vrr:1,rr:0
